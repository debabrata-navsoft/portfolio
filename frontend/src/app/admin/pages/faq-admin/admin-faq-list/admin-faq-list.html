<div class="flex min-h-0 min-w-0 flex-1 flex-col h-full">
  @if (isErrorMsg()) {
    <app-error />
  } @else {
    <app-data-table
      [rows]="faqs()"
      [columns]="columns"
      [filters]="filters"
      [actions]="actions"
      primaryButtonText="Add FAQ"
      primaryButtonIcon="plus"
      searchPlaceholder="Search"
      emptyMessage="No FAQs found."
      tableClass="w-full min-w-[760px]"
      (primaryAction)="addFAQ()"
      (action)="onAction($event)"
    />
  }
</div>
