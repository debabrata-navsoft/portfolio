<app-admin-card-list
  heading="Education & Academics"
  description="Manage your degrees, academic institutions, and certifications."
  icon="graduation-cap"
  noun="Education"
  emptyTitle="No Education Records Yet"
  emptyText='Get started by clicking the "Add Education" button to list your qualifications.'
  [cards]="cards()"
  [loading]="isLoading()"
  [error]="isErrorMsg()"
  [formOpen]="showForm()"
  (add)="openForm()"
  (edit)="openForm(byId($event))"
  (remove)="deleteEducation($event)"
  (dismiss)="closeForm()"
>
  @if (showForm()) {
    <app-admin-education-form [editData]="editingEducation()" (closeForm)="closeForm($event)" />
  }
</app-admin-card-list>
