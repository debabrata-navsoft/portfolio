@let unread = store.unreadCount();

<button
  type="button"
  (click)="isOpen.set(!isOpen())"
  class="relative flex h-9 w-9 cursor-pointer items-center justify-center rounded-full border border-gray-300 bg-white text-gray-600 shadow-2xs transition-all duration-150 hover:border-blue-500 hover:text-blue-600 hover:ring-2 hover:ring-blue-500/20 active:scale-95"
  [class.ring-2]="isOpen()"
  [class.ring-blue-500]="isOpen()"
  [class.border-blue-500]="isOpen()"
  [attr.aria-label]="unread ? unread + ' unread notifications' : 'Notifications'"
>
  <span [class.bell-ring]="ringing()">
    <lucide-icon name="bell" [size]="17" />
  </span>

  @if (unread) {
    <span
      class="absolute -right-1 -top-1 flex h-4.5 min-w-4.5 items-center justify-center rounded-full bg-rose-600 px-1 text-[10px] font-bold text-white ring-2 ring-white"
    >
      {{ unread > 9 ? '9+' : unread }}
    </span>
  }
</button>

@if (isOpen()) {
  <div
    class="notifications-panel absolute right-0 top-11 z-50 w-80 overflow-hidden rounded-2xl border border-gray-200/90 bg-white shadow-xl ring-1 ring-black/5 sm:w-96"
  >
    <div class="flex items-center justify-between border-b border-gray-100 px-4 py-3">
      <p class="text-sm font-bold text-gray-900">
        Notifications
        @if (unread) {
          <span class="ml-1 text-xs font-semibold text-rose-600">({{ unread }} new)</span>
        }
      </p>

      <button
        type="button"
        (click)="store.markAllRead()"
        [disabled]="!unread"
        class="inline-flex cursor-pointer items-center gap-1 text-xs font-semibold text-blue-600 hover:text-blue-700 disabled:cursor-default disabled:text-gray-300"
      >
        <lucide-icon name="check-check" [size]="14" />
        Mark all read
      </button>
    </div>

    <div class="max-h-96 overflow-y-auto">
      @for (notification of notifications(); track notification._id) {
        <button
          type="button"
          (click)="open(notification)"
          class="flex w-full cursor-pointer items-start gap-3 border-b border-gray-50 px-4 py-3 text-left transition-colors hover:bg-gray-50"
          [class.bg-blue-50/40]="!notification.isRead"
        >
          <span
            class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full"
            [class]="types[notification.type].iconClass"
          >
            <lucide-icon [name]="types[notification.type].icon" [size]="15" />
          </span>

          <span class="min-w-0 flex-1">
            <span class="block text-xs font-semibold text-gray-900">{{ notification.title }}</span>
            @if (notification.message) {
              <span class="mt-0.5 block truncate text-xs text-gray-500">
                {{ notification.message }}
              </span>
            }
            <span class="mt-1 block text-[11px] text-gray-400">
              {{ notification.createdAt | timeAgo }}
            </span>
          </span>

          @if (!notification.isRead) {
            <span class="mt-1.5 h-2 w-2 shrink-0 rounded-full bg-blue-600"></span>
          }
        </button>
      } @empty {
        <div class="flex flex-col items-center gap-2 px-4 py-10 text-center">
          <span class="text-gray-300"><lucide-icon name="bell" [size]="28" /></span>
          <p class="text-xs text-gray-400">No notifications yet</p>
        </div>
      }
    </div>

    <!-- 3-column footer so "See all" stays centred whether or not "Clear all" is shown -->
    <div class="grid grid-cols-3 items-center border-t border-gray-100 px-4 py-2">
      <span></span>

      <button
        type="button"
        (click)="seeAll()"
        class="cursor-pointer justify-self-center whitespace-nowrap text-xs font-semibold text-blue-600 hover:text-blue-700 hover:underline"
      >
        See all notifications
      </button>

      @if (notifications().length) {
        <button
          type="button"
          (click)="store.clearAll()"
          class="inline-flex cursor-pointer items-center gap-1 justify-self-end text-xs font-semibold text-rose-600 hover:text-rose-700"
        >
          <lucide-icon name="trash-2" [size]="13" />
          Clear all
        </button>
      }
    </div>
  </div>
}
