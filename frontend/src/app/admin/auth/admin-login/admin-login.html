<div class="flex min-h-screen items-center justify-center bg-gray-100 p-4">
  <div class="w-full max-w-md rounded-2xl border border-gray-200 bg-white p-8 shadow-xl">
    <!-- Header -->
    <div class="mb-6 text-center">
      <h2 class="text-3xl font-bold text-gray-900">Admin Login</h2>
      <p class="mt-1 text-sm text-gray-500">Login to manage portfolio projects</p>
    </div>

    <!-- Error -->
    @if (errorMessage()) {
      <div class="mb-4 rounded-lg bg-red-100 px-4 py-3 text-sm text-red-700">
        {{ errorMessage() }}
      </div>
    }

    <!-- Form -->
    <form (submit)="login(); $event.preventDefault()" class="space-y-4">
      <!-- Email -->
      <div>
        <label class="mb-1 block text-sm font-semibold text-gray-700"
          >Email <span class="text-red-500">*</span></label
        >
        <input
          type="email"
          placeholder="Enter admin email"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          (blur)="markTouched('email')"
          class="admin-input"
          [class.has-error]="isFieldInvalid('email')"
        />
        @if (isFieldInvalid('email')) {
          <p class="mt-1 text-xs font-medium text-red-500">Email is required</p>
        }
      </div>

      <!-- Password -->
      <div>
        <label class="mb-1 block text-sm font-semibold text-gray-700"
          >Password <span class="text-red-500">*</span></label
        >
        <div class="relative">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            placeholder="Enter password"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            (blur)="markTouched('password')"
            class="admin-input pr-11"
            [class.has-error]="isFieldInvalid('password')"
          />

          <!-- The icon must not carry positioning classes: lucide copies `class`
               onto the <svg> while Angular keeps it on the host, applying it twice. -->
          <button
            type="button"
            (click)="showPassword.set(!showPassword())"
            [title]="showPassword() ? 'Hide password' : 'Show password'"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showPassword()"
            tabindex="-1"
            class="absolute inset-y-0 right-0 flex w-11 items-center justify-center text-gray-400 transition hover:text-gray-600 cursor-pointer"
          >
            <lucide-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="18" />
          </button>
        </div>
        @if (isFieldInvalid('password')) {
          <p class="mt-1 text-xs font-medium text-red-500">Password is required</p>
        }
      </div>

      <!-- Button -->
      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full rounded-lg bg-blue-600 py-3 text-base font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-blue-300"
      >
        {{ isLoading() ? 'Logging in...' : 'Login' }}
      </button>
    </form>
  </div>
</div>
