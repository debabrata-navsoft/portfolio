@if (loaderService.startupLoading() && !isAdminPage()) {
  <app-startup-loader />
}

@if (loaderService.apiLoading()) {
  <app-api-loader />
}

<!-- Shared delete / confirm dialog, opened via ConfirmDialogService -->
<app-confirm-dialog />
<div class="overflow-x-clip">

  <div
    [ngClass]="{
      'w-full max-w-7xl mx-auto px-5 md:px-8 lg:px-10 xl:px-0': !isAdminPage(),
    }"
  >
    @if (!isAdminPage()) {
      <app-navbar />
    }

    <div
      [class]="
        !isAdminPage()
          ? 'min-h-screen pt-[calc(4.5rem+env(safe-area-inset-top,0px))]'
          : 'min-h-screen pt-0'
      "
    >
      <router-outlet />
    </div>
  </div>

  @if (!isAdminPage()) {
    <app-footer />
  }
</div>
