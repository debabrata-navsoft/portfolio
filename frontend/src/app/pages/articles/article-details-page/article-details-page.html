@if (isErrorMsg()) {
  <app-error />
} @else if (articles()) {
  <section class="py-10 md:py-16">
    <div class="mx-auto max-w-7xl px-5">
      <!-- Hero Header & Image -->
      <div class="flex flex-col gap-8 xl:flex-row xl:justify-between">
        <div
          appReveal
          revealAnimation="left"
          [revealDelay]="100"
          class="flex flex-col-reverse gap-4 xl:flex-col"
        >
          <app-gradient-text
            tagName="h6"
            [text]="
              (articles()!.createdAt | timeAgo) +
              ' • ' +
              articles()!.estimatedReadingTime +
              ' min read'
            "
            className="text-[13px] font-bold tracking-[4px] uppercase md:text-sm"
          />

          <h1
            class="max-w-162.5 text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-extrabold leading-[115%] text-gray-900 dark:text-white"
          >
            {{ articles()!.title }}
          </h1>
        </div>

        @if (articles()!.image) {
          <div
            appReveal
            revealAnimation="scale"
            [revealDelay]="200"
            class="overflow-hidden bg-neutral-800 shadow-md ring-1 ring-black/5 dark:ring-white/10 shrink-0 cursor-zoom-in"
            (click)="isImageModalOpen.set(true)"
          >
            <img
              [src]="articles()!.image"
              [alt]="articles()!.title"
              class="w-full object-cover transition-transform duration-300 hover:scale-105 xl:w-120 aspect-16/10"
            />
          </div>
        }
      </div>

      <!-- Fullscreen Image Modal -->
      <app-image-modal
        [(isOpen)]="isImageModalOpen"
        [src]="articles()!.image"
        [alt]="articles()!.title"
      />

      <!-- Excerpt Highlight -->
      @if (articles()!.excerpt) {
        <div
          appReveal
          revealAnimation="up"
          [revealDelay]="250"
          class="my-10 rounded-2xl border-l-4 border-rose-500 bg-gray-100/80 dark:bg-gray-900/50 p-6 md:p-8"
        >
          <h2
            class="text-xl md:text-2xl font-normal italic leading-relaxed text-gray-700 dark:text-gray-300"
          >
            "{{ articles()!.excerpt }}"
          </h2>
        </div>
      }

      <!-- Main Article Content -->
      <div class="mt-8 pt-4 border-t border-gray-100 dark:border-gray-800">
        <div
          appCodeCopy
          class="whitespace-pre-line text-base sm:text-lg md:text-xl leading-relaxed text-gray-800 dark:text-gray-300"
          [innerHTML]="articles()!.content | formatText"
        ></div>
      </div>

      <!-- Assigned Tags -->
      @if (articles()!.tags && articles()!.tags.length > 0) {
        <div class="mt-14 pt-6 border-t border-gray-100 dark:border-gray-800">
          <h4
            class="mb-3 text-xs font-bold uppercase tracking-wider text-gray-400 dark:text-gray-500"
          >
            Tagged Topics
          </h4>
          <div class="flex flex-wrap gap-2">
            @for (tag of articles()!.tags; track tag) {
              <span
                class="inline-flex items-center gap-1.5 rounded-full border border-gray-200 dark:border-gray-800 bg-gray-100/80 dark:bg-gray-800/80 px-4 py-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300 transition hover:border-indigo-400 hover:text-indigo-600 dark:hover:text-indigo-400"
              >
                <span class="text-indigo-500 font-bold">#</span>
                {{ tag }}
              </span>
            }
          </div>
        </div>
      }
    </div>
  </section>
}
