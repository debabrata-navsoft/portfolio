<section id="about" class="my-20 scroll-mt-32">
  <div class="mb-20 flex flex-col items-start justify-between gap-4 lg:flex-row">
    <div appReveal revealAnimation="left" [revealDelay]="0">
      <app-gradient-text
        tagName="h3"
        text="Frontend Developer"
        [showLine]="true"
        class="text-2xl uppercase font-bold tracking-[4px]"
      />

      <h2 class="mb-4 mt-4 text-[40px] font-bold leading-[120%] md:text-[54px]">That's me!</h2>
    </div>

    <div appReveal revealAnimation="right" [revealDelay]="200" class="text-left lg:max-w-3xl">
      <div
        class="about-content text-base text-gray-500 md:text-base lg:text-lg"
        [innerHTML]="abouts().description | formatText"
      ></div>
    </div>
  </div>

  <!-- Images -->
  <div class="grid grid-cols-2 gap-4 md:grid-cols-4">
    <img
      appReveal
      revealAnimation="up"
      [revealDelay]="0"
      [src]="abouts().images[0]"
      alt="About image 0"
      class="col-span-2 w-full h-full xl:col-start-2 xl:col-end-4 xl:row-start-1 xl:row-end-3 xl:h-full xl:w-auto"
    />

    <img
      appReveal
      revealAnimation="up"
      [revealDelay]="150"
      [src]="abouts().images[1]"
      alt="About image 1"
      class="col-span-1 w-full h-full xl:col-span-1 xl:col-start-4 xl:row-start-1 xl:row-end-2 xl:h-full xl:w-auto"
    />

    <img
      appReveal
      revealAnimation="up"
      [revealDelay]="300"
      [src]="abouts().images[2]"
      alt="About image 2"
      class="col-span-1 w-full h-full xl:col-span-1 xl:col-start-4 xl:row-start-2 xl:row-end-3 xl:h-full xl:w-auto xl:object-cover"
    />

    <img
      appReveal
      revealAnimation="up"
      [revealDelay]="450"
      [src]="abouts().images[3]"
      alt="About image 3"
      class="col-span-2 w-full h-full xl:col-span-1 xl:col-start-1 xl:row-span-2 xl:row-start-1 xl:row-end-3 xl:aspect-9/16 xl:h-full xl:w-auto xl:object-cover"
    />
  </div>
</section>
