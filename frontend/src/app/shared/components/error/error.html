<div
  class="flex w-full flex-col items-center justify-center gap-3 rounded-2xl border border-rose-200 bg-rose-50/60 px-6 py-12 text-center dark:border-rose-900/50 dark:bg-rose-950/20"
  role="alert"
>
  <span
    class="flex h-12 w-12 items-center justify-center rounded-2xl bg-rose-100 text-rose-600 dark:bg-rose-900/40 dark:text-rose-400"
  >
    <lucide-icon name="triangle-alert" [size]="24" />
  </span>

  <h3 class="text-base font-bold text-gray-900 dark:text-white">{{ title() }}</h3>

  <p class="max-w-sm text-sm text-gray-500 dark:text-gray-400">{{ message() }}</p>

  @if (showRetry()) {
    <button type="button" (click)="reload()" class="error-action">
      <lucide-icon name="rotate-cw" [size]="14" />
      Try again
    </button>
  }

  @if (showHome()) {
    <a routerLink="/" class="error-action">
      <lucide-icon name="arrow-left" [size]="14" />
      Back to home
    </a>
  }
</div>
