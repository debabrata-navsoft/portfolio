<section
  class="fixed inset-0 z-[99999] flex items-center justify-center bg-white dark:bg-black"
  [class.preloader-exit]="isExiting()"
>
  <div class="loader-content flex flex-col items-center gap-4">
    <app-gradient-text
      tagName="h2"
      text="<dev-debabrata />"
      className="text-3xl font-bold md:text-4xl xl:text-5xl"
    />

    <div class="h-[3px] w-36 overflow-hidden rounded-full bg-gray-200 dark:bg-gray-800">
      <div
        class="loading-bar h-full w-full bg-gradient-to-r from-purple-400 via-red-500 to-orange-600"
      ></div>
    </div>

    @if (showSlowHint()) {
      <p class="max-w-xs text-center text-xs text-gray-500 dark:text-gray-400">
        Waking up the server — this can take a few seconds on the first visit.
      </p>
    }
  </div>
</section>
