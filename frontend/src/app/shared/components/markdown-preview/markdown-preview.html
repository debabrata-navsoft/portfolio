@if (value()) {
  <div class="mt-2 rounded-lg bg-gray-50 border border-gray-100 p-2.5 text-xs text-gray-600">
    <span class="font-semibold text-gray-400 uppercase tracking-wider text-[10px] block mb-1">
      {{ label() }}:
    </span>
    <div
      appCodeCopy
      class="whitespace-pre-line text-slate-800 leading-relaxed"
      [innerHTML]="value() | formatText"
    ></div>
  </div>
}
