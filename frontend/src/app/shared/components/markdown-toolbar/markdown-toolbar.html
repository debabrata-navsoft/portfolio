<div class="flex items-center gap-1.5">
  <button
    type="button"
    (click)="apply('bold')"
    class="inline-flex h-6 w-6 items-center justify-center rounded border border-gray-200 bg-gray-50 text-xs font-bold text-gray-700 hover:bg-gray-200 hover:text-black transition cursor-pointer"
    title="Bold: wrap in **bold**"
  >
    B
  </button>
  <button
    type="button"
    (click)="apply('italic')"
    class="inline-flex h-6 w-6 items-center justify-center rounded border border-gray-200 bg-gray-50 text-xs italic font-serif text-gray-700 hover:bg-gray-200 hover:text-black transition cursor-pointer"
    title="Italic: wrap in *italic*"
  >
    I
  </button>
  @if (showCode()) {
    <button
      type="button"
      (click)="apply('code')"
      class="inline-flex h-6 w-6 items-center justify-center rounded border border-gray-200 bg-gray-50 text-[10px] font-mono font-bold text-gray-700 hover:bg-gray-200 hover:text-black transition cursor-pointer"
      title="Code: wrap in `code`"
    >
      &lt;/&gt;
    </button>
  }
  <span class="text-[11px] text-gray-400 ml-1"
    >Tip: Use <code class="text-indigo-600 font-semibold">**bold**</code> or
    <code class="text-indigo-600 font-semibold">&lt;b&gt;bold&lt;/b&gt;</code></span
  >
</div>
