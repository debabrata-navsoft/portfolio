<section
  id="home"
  class="mx-auto my-20 md:my-25 flex max-w-7xl flex-col-reverse items-center gap-12 px-6 xl:flex-row xl:px-0 overflow-hidden"
>
  <!-- Left Content -->
  <div appReveal revealAnimation="left" [revealDelay]="0" class="text-center xl:text-left">
    <h1 class="mb-4 text-[40px] font-bold leading-[110%] md:text-[70px]">
      <app-gradient-text tagName="span" [text]="profileContent().heroGradientText" />

      {{ profileContent().heroHeading }}
    </h1>

    <p class="mx-auto mb-10 max-w-175 text-[18px] leading-8 text-gray-500 lg:text-[20px] xl:mx-0">
      <span class="font-semibold text-gray-700 dark:text-gray-400">
        {{ profileContent().introduction }}
      </span>
      <span class="hero-content" [innerHTML]="' ' + profileContent().profileDescription"></span>
    </p>

    <!-- Buttons -->
    <div
      appReveal
      revealAnimation="up"
      [revealDelay]="200"
      class="mb-10 flex flex-col items-center gap-10 md:gap-5 md:flex-row xl:items-center xl:justify-start"
    >
      <app-custom-button text="Book a call" link="/contact" width="w-[150px]"></app-custom-button>

      <app-custom-nav
        text="Download CV"
        class="text-lg font-bold"
        [href]="resumeUrl()"
        [iconSize]="24"
      />
    </div>

    <!-- Social -->
    <div
      appReveal
      revealAnimation="up"
      [revealDelay]="400"
      class="flex justify-center gap-5 xl:justify-start"
    >
      @for (social of socialLinks; track social.title) {
        <a
          [href]="social.link"
          target="_blank"
          class="rounded-full border border-gray-200 p-3 transition-all duration-300 hover:-translate-y-1 hover:bg-gray-900 dark:hover:bg-gray-500 hover:text-white"
        >
          <lucide-icon [name]="social.icon" [size]="20"></lucide-icon>
        </a>
      }
    </div>
  </div>

  <!-- Right Image -->
  <!-- <div class="flex flex-1 justify-center xl:justify-end"> -->
  <img
    appReveal
    revealAnimation="scale"
    [revealDelay]="0"
    [src]="profileContent().imageUrl"
    alt="Debabrata Das"
    class="aspect-square w-full max-w-112.5 rounded-full object-cover"
  />

  <!-- </div> -->
</section>
